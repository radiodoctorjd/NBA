<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NBA game predictions: winners, spreads, totals, first-half picks, injuries and projected lineups.">
<title>NBA Model Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout matches the NCAAB page: sticky header with tabs, day heading, stat strip, filter rail, responsive grid of game cards; tables for standings, rankings and team stats. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E7EBF1; --fg:#132033; --muted:#5A6779; --line:#D3DAE4;
  --accent:#C9661A; --accent-soft:#F7E3D2; --court:#1F4E8C; --court-soft:#DCE7F5;
  --good:#1B7A4B; --good-bg:#D9F0E3; --warn:#8F5E00; --warn-bg:#FBEBC6; --bad:#B03535; --bad-bg:#F7DADA;
  --away:#8A96A8; --home:#1F4E8C;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C121A; --surface:#131B26; --surface-2:#1A2431; --fg:#E4EAF2; --muted:#93A0B3; --line:#253244;
  --accent:#F08B32; --accent-soft:#3A2614; --court:#6FA3E8; --court-soft:#182A42;
  --good:#52C78F; --good-bg:#143224; --warn:#E3B24E; --warn-bg:#3A2E12; --bad:#F27D7D; --bad-bg:#3D1B1B;
  --away:#5D6A7D; --home:#6FA3E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121A; --surface:#131B26; --surface-2:#1A2431; --fg:#E4EAF2; --muted:#93A0B3; --line:#253244;
  --accent:#F08B32; --accent-soft:#3A2614; --court:#6FA3E8; --court-soft:#182A42;
  --good:#52C78F; --good-bg:#143224; --warn:#E3B24E; --warn-bg:#3A2E12; --bad:#F27D7D; --bad-bg:#3D1B1B;
  --away:#5D6A7D; --home:#6FA3E8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1;white-space:nowrap}
.brand h1 b{color:var(--accent);font-weight:700}
.brand small{color:var(--muted);font-size:13px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px}
nav.tabs a:hover{color:var(--fg);background:var(--surface-2)}
nav.tabs a[aria-current="page"]{background:var(--court);color:#fff}
:root[data-theme="dark"] nav.tabs a[aria-current="page"]{color:#0C121A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs a[aria-current="page"]{color:#0C121A}}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 40px}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.notice p{margin:0;flex:1 1 260px;min-width:0}
.notice.err{border-left-color:var(--bad)}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--court)}
.dayhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.dayhead h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;text-wrap:balance}
.dayhead .sub{color:var(--muted);font-size:14px}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:16px}
.filters input[type=search],.filters select{font:inherit;font-size:14px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 200px;max-width:280px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--court-soft);color:var(--court)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--court);width:16px;height:16px}
/* At most two columns: each card is at least half the row (or 330px on small screens) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(330px,calc((100% - 16px) / 2)),1fr));gap:16px;align-items:start}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.meta .time{font-family:var(--display);font-weight:600;font-size:16px;color:var(--fg);letter-spacing:.02em}
.meta .right{margin-left:auto;display:flex;gap:6px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.strong{background:var(--good-bg);color:var(--good)}
.pill.moderate{background:var(--warn-bg);color:var(--warn)}
.pill.toss{background:var(--bad-bg);color:var(--bad)}
.pill.b2b{background:var(--accent-soft);color:var(--accent);cursor:help}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px 12px;align-items:center}
.tname{display:flex;align-items:center;gap:8px;min-width:0}
.tname .team-id{display:flex;flex-direction:column;align-items:center;gap:3px;width:48px;flex:none}
.team-id .abbr{font-family:var(--display);font-weight:700;font-size:18px;line-height:1;letter-spacing:.02em}
.team-id img{display:block;width:30px;height:30px;object-fit:contain}
td.team picture{display:inline}
.tname .nm{min-width:0;display:flex;flex-direction:column}
.tname .row1{display:flex;align-items:center;gap:6px;min-width:0}
.tname strong{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname:not(.pick) strong{color:var(--muted);font-weight:500}
.tname .rec{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .w{color:var(--good);font-weight:600}
.rec .l{color:var(--bad);font-weight:600}
.b2b-slot{display:inline-flex;flex:none}
.b2b-slot:empty{display:none}
.wp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.pts{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-align:right;min-width:3.6ch}
.pts small{display:block;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.bar{height:6px;border-radius:999px;background:var(--away);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--home);margin-left:auto}
.lines{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px dashed var(--line);padding-top:8px;margin:0}
.lines div{min-width:0}
@media (max-width:480px){.lines{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px}}
.lines dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lines dd{margin:0;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lines dd small{font-weight:500;color:var(--muted)}
.leans{display:flex;flex-wrap:wrap;gap:6px}
.lean{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bad-bg);color:var(--bad);font-variant-numeric:tabular-nums}
details.more{border-top:1px solid var(--line);padding-top:6px}
details.more + details.more{border-top:0;padding-top:0}
details.more summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;display:flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";width:1ch}
details.more[open] summary::before{content:"−"}
details.more summary .sumx{margin-left:auto;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted)}
.kv .full{grid-column:1/-1;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.two h4{margin:0 0 4px;font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.plist{list-style:none;margin:0;padding:0;font-size:13px}
.plist li{display:flex;gap:6px;align-items:baseline;padding:2px 0;min-width:0}
.plist .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .why{display:block;font-size:11px;color:var(--muted);white-space:normal}
.plist .pos{font-size:11px;font-weight:600;color:var(--muted);width:2.4ch;flex:none}
.st{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:4px;white-space:nowrap;flex:none}
.st.out{background:var(--bad-bg);color:var(--bad)}
.st.doubt{background:var(--accent-soft);color:var(--accent)}
.st.q,.st.dtd{background:var(--warn-bg);color:var(--warn)}
.st.prob,.st.confirmed{background:var(--good-bg);color:var(--good)}
.st.expected{background:var(--warn-bg);color:var(--warn)}
.st.projected,.st.src{background:var(--surface-2);color:var(--muted)}
.subl{font-size:12px;color:var(--muted);margin-top:4px}
.subl b{font-weight:600;color:var(--fg)}
.none{font-size:13px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
th[data-k]{cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
tbody tr:hover{background:var(--surface-2)}
td.team{font-weight:600}
td.team img{width:20px;height:20px;object-fit:contain;vertical-align:-5px;margin-right:6px}
tr.cut td{border-bottom:2px solid var(--court)}
tr.cut2 td{border-bottom:2px dashed var(--accent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.conf{font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.conf.East{border-color:var(--accent);color:var(--accent)}
.conf.West{border-color:var(--court);color:var(--court)}
.section-h{font-family:var(--display);font-weight:700;font-size:28px;margin:0 0 10px}
.group-h{font-family:var(--display);font-weight:700;font-size:20px;margin:18px 0 8px}
.cbars{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.cbar{display:grid;grid-template-columns:minmax(90px,190px) minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13px}
.cbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .track{position:relative;height:14px}
.cbar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.cbar .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.cbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{color:var(--muted);font-size:13px;margin-top:10px;max-width:70ch}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:16px 28px;display:flex;flex-wrap:wrap;gap:6px 18px}
footer .stale{color:var(--warn);font-weight:600}
.skel{height:190px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.muted{color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>NBA <b>Model</b> Picks</h1><small id="srcLabel">Loading…</small></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-v="today">Today</a>
      <a href="#tomorrow" data-v="tomorrow">Tomorrow</a>
      <a href="#standings" data-v="standings">Standings</a>
      <a href="#rankings" data-v="rankings">ELO Rankings</a>
      <a href="#teams" data-v="teams">Team Stats</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="notice"></div>
  <div id="view"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
</main>

<footer>
  <div class="wrap" id="updated">NBA Model Picks · 2026–27 season</div>
</footer>

<script>
(() => {
// Deployed NBA Apps Script Web App (JSONP).
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwpkeJpkmxyOzk8pM1PGHPln6f1NwR6fQEUr5iXQjnbTs63pACxebURHcFpSiQpb1EZ/exec';


// ── ESPN team logo & injury data ──────────────────────────────
// Logo URLs from ESPN CDN (confirmed via API)
const TEAM_LOGOS = {
  ATL: 'https://a.espncdn.com/i/teamlogos/nba/500/atl.png',
  BOS: 'https://a.espncdn.com/i/teamlogos/nba/500/bos.png',
  BKN: 'https://a.espncdn.com/i/teamlogos/nba/500/bkn.png',
  CHA: 'https://a.espncdn.com/i/teamlogos/nba/500/cha.png',
  CHI: 'https://a.espncdn.com/i/teamlogos/nba/500/chi.png',
  CLE: 'https://a.espncdn.com/i/teamlogos/nba/500/cle.png',
  DAL: 'https://a.espncdn.com/i/teamlogos/nba/500/dal.png',
  DEN: 'https://a.espncdn.com/i/teamlogos/nba/500/den.png',
  DET: 'https://a.espncdn.com/i/teamlogos/nba/500/det.png',
  GSW: 'https://a.espncdn.com/i/teamlogos/nba/500/gs.png',
  HOU: 'https://a.espncdn.com/i/teamlogos/nba/500/hou.png',
  IND: 'https://a.espncdn.com/i/teamlogos/nba/500/ind.png',
  LAC: 'https://a.espncdn.com/i/teamlogos/nba/500/lac.png',
  LAL: 'https://a.espncdn.com/i/teamlogos/nba/500/lal.png',
  MEM: 'https://a.espncdn.com/i/teamlogos/nba/500/mem.png',
  MIA: 'https://a.espncdn.com/i/teamlogos/nba/500/mia.png',
  MIL: 'https://a.espncdn.com/i/teamlogos/nba/500/mil.png',
  MIN: 'https://a.espncdn.com/i/teamlogos/nba/500/min.png',
  NOP: 'https://a.espncdn.com/i/teamlogos/nba/500/no.png',
  NYK: 'https://a.espncdn.com/i/teamlogos/nba/500/ny.png',
  OKC: 'https://a.espncdn.com/i/teamlogos/nba/500/okc.png',
  ORL: 'https://a.espncdn.com/i/teamlogos/nba/500/orl.png',
  PHI: 'https://a.espncdn.com/i/teamlogos/nba/500/phi.png',
  PHX: 'https://a.espncdn.com/i/teamlogos/nba/500/phx.png',
  POR: 'https://a.espncdn.com/i/teamlogos/nba/500/por.png',
  SAC: 'https://a.espncdn.com/i/teamlogos/nba/500/sac.png',
  SAS: 'https://a.espncdn.com/i/teamlogos/nba/500/sa.png',
  TOR: 'https://a.espncdn.com/i/teamlogos/nba/500/tor.png',
  UTA: 'https://a.espncdn.com/i/teamlogos/nba/500/utah.png',
  WAS: 'https://a.espncdn.com/i/teamlogos/nba/500/wsh.png',
};

const S = { games:[], ranks:[], rankMap:{}, stamps:null, generated:null, loaded:null, injuries:null, injUpdated:null, lineups:null, luUpdated:null, err:null, ready:false };
const ui = { q:"", tier:"all", b2bOnly:false, sort:"tip", stGroup:"conf", rkSort:{k:"elo",dir:-1}, tsQ:"", tsConf:"all", tsSort:{k:"elo",dir:-1} };
try { const s = JSON.parse(localStorage.getItem("nba-ui")||"{}"); if (s.sort) ui.sort=s.sort; if (s.stGroup) ui.stGroup=s.stGroup; } catch(e) {}
function saveUi(){ try{ localStorage.setItem("nba-ui", JSON.stringify({sort:ui.sort, stGroup:ui.stGroup})); }catch(e){} }

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { if (v==null || v==="") return null; const x = Number(String(v).replace(/[,%]/g,"")); return isNaN(x) ? null : x; };
const f1 = x => x==null ? "—" : Number(x).toFixed(1);
const minus = s => String(s).replace(/-/g,"−");
const signed = x => x==null ? "—" : minus((x>0?"+":"") + Number(x).toFixed(1));
// ESPN logo; in dark mode use ESPN's dark-background version, falling back to the regular logo, then hiding it.
const logo = (abbr, alt="") => TEAM_LOGOS[abbr] ? `<picture><source srcset="${TEAM_LOGOS[abbr].replace('/500/','/500-dark/')}" media="(prefers-color-scheme: dark)"><img src="${TEAM_LOGOS[abbr]}" alt="${esc(alt)}" loading="lazy" onerror="var s=this.previousElementSibling;if(s){s.remove();}else{this.style.visibility='hidden';}"></picture>` : "";
// Abbreviation with the logo centered underneath (same as the NHL page)
const teamId = abbr => `<div class="team-id"><span class="abbr">${esc(abbr)}</span>${logo(abbr)}</div>`;
function tipMinutes(s){ const m = String(s||"").match(/(\d{1,2}):(\d{2})\s*([AP]M)/i); if(!m) return 9999; let h=+m[1]%12; if(m[3].toUpperCase()==="PM") h+=12; return h*60 + +m[2]; }
function dayLabel(off){ const d=new Date(); d.setDate(d.getDate()+off); return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}); }
function wlClass(s){ const p=String(s||"").split("-").map(Number); return p.length<2||isNaN(p[0])||isNaN(p[1]) ? "" : p[0]>p[1] ? "pos" : p[0]<p[1] ? "neg" : ""; }
function wlDiff(s){ const p=String(s||"").split("-").map(Number); return (p[0]||0)-(p[1]||0); }

// Confidence comes from the sheet as e.g. HIGH / MED / LOW; map to NCAAB-style tiers.
function tierOf(c){ const u=String(c||"").trim().toUpperCase(); return u.startsWith("H")||u.startsWith("S") ? "strong" : u.startsWith("M") ? "moderate" : u ? "toss" : ""; }
const TIER_LABEL = { strong:"High", moderate:"Medium", toss:"Low" };

/* ---------- Injury / lineup helpers ---------- */
function injClass(s){
  const sl = String(s||"").toLowerCase();
  if (sl.includes("doubt")) return "doubt";
  if (sl.includes("prob")) return "prob";
  if (sl.includes("question") || sl.includes("game time") || sl.includes("game-time") || sl.includes("gtd")) return "q";
  if (sl.includes("day")) return "dtd";
  if (!sl || /\bout\b/.test(sl) || sl.includes("suspend") || sl.includes("inactive")) return "out";
  return "q";
}
const INJ_LABEL = { out:"Out", doubt:"Doubtful", q:"Questionable", prob:"Probable", dtd:"Day-to-day" };
function teamInjuries(g, side){
  const abbr = g[side];
  if (S.injuries) return S.injuries[abbr] || [];
  return g[side+"Injuries"] || [];
}
function lineupKey(g, team){ const d=String(g.date||""); return (d.length===8 ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}` : d) + "|" + team; }
function teamLineup(g, side){ return (S.lineups && S.lineups[lineupKey(g, g[side])]) || g[side+"Lineup"] || null; }

function injuryCol(g, side){
  const list = teamInjuries(g, side);
  const eloD = n(g[side+"InjuryElo"]);
  const outN = list.filter(p => injClass(p.status)==="out").length;
  const head = `<h4>${esc(g[side+"Name"]||g[side])}${outN?`<span class="st out">${outN} out</span>`:""}${eloD?`<span class="st src" title="ELO points the model deducted for injuries">${minus("-"+Math.abs(eloD).toFixed(1))} ELO</span>`:""}</h4>`;
  if (!list.length) return `<div>${head}<div class="none">No reported injuries</div></div>`;
  return `<div>${head}<ul class="plist">${list.map(p => `<li><span class="st ${injClass(p.status)}" title="${esc(p.status)}">${INJ_LABEL[injClass(p.status)]}</span><span class="who">${esc(p.name||p.player)}${(p.injury||p.detail)?`<span class="why">${esc(p.injury||p.detail)}</span>`:""}</span></li>`).join("")}</ul></div>`;
}
function lineupCol(g, side){
  const lu = teamLineup(g, side);
  const name = esc(g[side+"Name"]||g[side]);
  if (!lu || !lu.starters || !lu.starters.length) return `<div><h4>${name}</h4><div class="none">Lineup not available yet</div></div>`;
  const stCls = String(lu.status||"").toLowerCase();
  const tag = p => p.injuryStatus ? `<span class="st ${injClass(p.injuryStatus)}" title="${esc(p.injuryStatus)}">${INJ_LABEL[injClass(p.injuryStatus)]}</span>` : "";
  const bench = (lu.bench||[]).map(p => esc(p.name) + (p.injuryStatus ? ` (${INJ_LABEL[injClass(p.injuryStatus)].charAt(0)})` : "")).join(", ");
  const out = (lu.out||[]).map(p => esc(p.name)).join(", ");
  return `<div><h4>${name}${lu.status?`<span class="st ${esc(stCls)}">${esc(lu.status)}</span>`:""}${lu.source?`<span class="st src">${esc(lu.source)}</span>`:""}</h4>
    <ul class="plist">${lu.starters.map(p => `<li><span class="pos">${esc(p.pos||"—")}</span><span class="who" title="${esc(p.name)}">${esc(p.name)}${p.replaces?` <span class="muted">for ${esc(p.replaces)}</span>`:""}</span>${tag(p)}</li>`).join("")}</ul>
    ${bench?`<div class="subl"><b>Bench</b> ${bench}</div>`:""}${out?`<div class="subl"><b>Out</b> ${out}</div>`:""}</div>`;
}
function injSummary(g){
  const a = teamInjuries(g,"away").filter(p=>injClass(p.status)==="out").length;
  const h = teamInjuries(g,"home").filter(p=>injClass(p.status)==="out").length;
  return (a||h) ? `${esc(g.away)} ${a} out · ${esc(g.home)} ${h} out` : "None out";
}
function luSummary(g){
  const a = teamLineup(g,"away"), h = teamLineup(g,"home");
  const s = [a,h].map(x => x && x.status ? x.status : null).filter(Boolean);
  return s.length ? [...new Set(s)].join(" / ") : "Not posted";
}

/* ---------- Back-to-back badges ----------
   A team is on a back-to-back when it also played the calendar day before
   this game. Game days come from the sheet (today / tomorrow) plus ESPN's
   public scoreboard for yesterday and today, so today's games can see last
   night's results. Cards render an empty .b2b-slot next to each team;
   applyB2BBadges() fills them whenever either data source arrives. */
const B2B_ESPN_PATH = 'basketball/nba';
// ESPN abbreviation -> abbreviation used by the sheet
const B2B_ALIASES = { GS:'GSW', NO:'NOP', NY:'NYK', SA:'SAS', UTAH:'UTA', WSH:'WAS' };
const _b2bPlayed = {};   // team abbr -> Set of 'YYYY-MM-DD' (local)
function b2bKey(abbr){ const a = String(abbr || '').trim().toUpperCase(); return B2B_ALIASES[a] || a; }
function b2bDay(offset){ const d = new Date(); d.setDate(d.getDate() + offset); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function b2bAddGame(abbr, day){ const k = b2bKey(abbr); if (!k || !day) return; (_b2bPlayed[k] = _b2bPlayed[k] || new Set()).add(day); }
function isB2B(g, side){
  if (g[side+"B2B"] === true) return true;
  const set = _b2bPlayed[b2bKey(g[side])];
  return !!(set && set.has(b2bDay(g._off - 1)));
}
function b2bSlot(g, side){ return `<span class="b2b-slot" data-gid="${g._gid}" data-side="${side}"></span>`; }
function applyB2BBadges(){
  document.querySelectorAll('.b2b-slot').forEach(slot => {
    const g = S.games[+slot.dataset.gid]; if (!g) return;
    const team = g[slot.dataset.side];
    slot.innerHTML = isB2B(g, slot.dataset.side) ? `<span class="pill b2b" title="${esc(team)} is on a back-to-back (also played the previous day)">B2B</span>` : '';
  });
  const c = $("#b2bCount"); if (c) c.textContent = document.querySelectorAll('.b2b-slot .b2b').length;
}
async function loadB2BFromESPN(){
  await Promise.all([-1, 0].map(async offset => {
    const day = b2bDay(offset);
    try {
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${B2B_ESPN_PATH}/scoreboard?dates=${day.replace(/-/g,'')}`, { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!res.ok) return;
      const data = await res.json();
      (data.events || []).forEach(ev => ((ev.competitions && ev.competitions[0] && ev.competitions[0].competitors) || []).forEach(c => b2bAddGame(c.team && c.team.abbreviation, day)));
    } catch (e) { /* offline / blocked: sheet data only */ }
  }));
  S.b2bLoaded = true;
  if (currentView()==="today" || currentView()==="tomorrow") render(); else applyB2BBadges();
}

/* ---------- Views ---------- */
const VIEWS = ["today","tomorrow","standings","rankings","teams"];
function currentView(){ const h=(location.hash||"").replace("#",""); return VIEWS.includes(h) ? h : "today"; }
function render(){
  const v = currentView();
  document.querySelectorAll("nav.tabs a").forEach(a => { if(a.dataset.v===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderStamps();
  if (!S.ready) { if (S.err) $("#view").innerHTML = `<div class="empty">No predictions loaded.</div>`; return; }
  if (v==="today" || v==="tomorrow") renderDay(v);
  else if (v==="standings") renderStandings();
  else if (v==="rankings") renderRankings();
  else renderTeams();
}

/* Update stamps: when the SHEET last refreshed each feed (sent by Apps Script as dataUpdated). */
function fmtStamp(iso){
  if (!iso) return "—"; const d = new Date(iso); if (isNaN(d)) return "—";
  const t = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  return d.toDateString()===new Date().toDateString() ? t : d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + ", " + t;
}
// Injuries/lineups refresh hourly 7 AM–last tip ET; flag them if they're >3h old during that window.
function isStale(iso){
  if (!iso) return true;
  const etHour = Number(new Date().toLocaleString("en-US",{timeZone:"America/New_York",hour:"numeric",hour12:false}));
  return etHour >= 8 && etHour <= 23 && (Date.now() - new Date(iso).getTime()) > 3*3600*1000;
}
function renderStamps(){
  const lab = $("#srcLabel"), up = $("#updated");
  if (!S.ready) { lab.textContent = S.err ? "Not connected" : "Loading…"; return; }
  const st = S.stamps;
  lab.textContent = st && st.predictions ? `Predictions updated ${fmtStamp(st.predictions)}` : `Loaded ${fmtStamp(S.generated || S.loaded)}`;
  if (!st) { up.textContent = `Data loaded ${fmtStamp(S.generated || S.loaded)}`; return; }
  const items = [["Predictions", st.predictions, false], ["Scores", st.scores, false], ["Injuries", st.injuries, isStale(st.injuries)], ["Lineups", st.lineups, isStale(st.lineups)]];
  up.innerHTML = `<span>Sheet last updated:</span>` + items.map(([l, iso, stale]) => `<span class="${stale?"stale":""}" title="${l} last updated in the sheet: ${iso ? esc(new Date(iso).toLocaleString("en-US")) : "never"}${stale?" (may be stale)":""}">${l} ${fmtStamp(iso)}${stale?" ⚠":""}</span>`).join("")
    + (st.injuriesSource ? `<span>Injuries from ${esc(st.injuriesSource)}</span>` : "")
    + (S.loaded ? `<span>Page loaded ${fmtStamp(S.loaded.toISOString())}</span>` : "");
}

function renderDay(which){
  const off = which==="tomorrow" ? 1 : 0;
  const all = S.games.filter(g => g._off===off);
  const strong = all.filter(g => tierOf(g.confidence)==="strong").length;
  const tiers = ["strong","moderate","toss"].filter(t => all.some(g => tierOf(g.confidence)===t));

  let list = all.filter(g => {
    if (ui.tier!=="all" && tierOf(g.confidence)!==ui.tier) return false;
    if (ui.b2bOnly && !isB2B(g,"away") && !isB2B(g,"home")) return false;
    if (ui.q){ const q=ui.q.toLowerCase(); if (![g.away,g.home,g.awayName,g.homeName].some(x => String(x||"").toLowerCase().includes(q))) return false; }
    return true;
  });
  const maxProb = g => Math.max(n(g.homeWinProb)||0, n(g.awayWinProb)||0);
  const sorters = {
    tip: (a,b) => tipMinutes(a.time) - tipMinutes(b.time) || a._gid-b._gid,
    prob: (a,b) => maxProb(b) - maxProb(a),
    close: (a,b) => Math.abs(n(a.spread)||0) - Math.abs(n(b.spread)||0),
    total: (a,b) => (n(b.fullTotal)||0) - (n(a.fullTotal)||0)
  };
  list.sort(sorters[ui.sort] || sorters.tip);

  const segBtn = (val,label) => `<button type="button" data-tier="${val}" aria-pressed="${ui.tier===val}">${label}</button>`;
  $("#view").innerHTML = `
    <div class="dayhead"><div><div class="sub">${which==="today"?"Today":"Tomorrow"} · tip times Eastern</div><h2>${esc(dayLabel(off))}</h2></div></div>
    <div class="strip">
      <div class="stat"><b>${all.length}</b><span>Games</span></div>
      <div class="stat"><b>${strong}</b><span>High-confidence picks</span></div>
      <div class="stat"><b id="b2bCount">0</b><span>Teams on a B2B</span></div>
    </div>
    ${all.length ? `<div class="filters" role="search">
      <input id="q" type="search" placeholder="Find a team" value="${esc(ui.q)}" aria-label="Find a team">
      <div class="seg" role="group" aria-label="Confidence">${segBtn("all","All")}${tiers.map(t => segBtn(t, TIER_LABEL[t])).join("")}</div>
      <label class="toggle"><input id="b2bOnly" type="checkbox"${ui.b2bOnly?" checked":""}> Back-to-backs only</label>
      <select id="sortSel" aria-label="Sort">
        <option value="tip"${ui.sort==="tip"?" selected":""}>Sort: tip time</option>
        <option value="prob"${ui.sort==="prob"?" selected":""}>Sort: most confident</option>
        <option value="close"${ui.sort==="close"?" selected":""}>Sort: closest spread</option>
        <option value="total"${ui.sort==="total"?" selected":""}>Sort: highest total</option>
      </select>
    </div>` : ""}
    ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` :
      `<div class="empty">${all.length ? "No games match these filters." : "No games scheduled."}</div>`}`;
  applyB2BBadges();
  if (!all.length) return;
  $("#q").addEventListener("input", e => { ui.q=e.target.value; const pos=e.target.selectionStart; renderDay(which); const q=$("#q"); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} });
  $("#sortSel").addEventListener("change", e => { ui.sort=e.target.value; saveUi(); renderDay(which); });
  $("#b2bOnly").addEventListener("change", e => { ui.b2bOnly=e.target.checked; renderDay(which); });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { ui.tier=b.dataset.tier; renderDay(which); }));
}

function favLine(sp, favAbbr){ sp=n(sp); if (sp==null) return "—"; if (Math.abs(sp) < 0.05) return "Pick'em"; return `${favAbbr} ${minus("-"+Math.abs(sp).toFixed(1))}`; }

function card(g){
  const hWin=n(g.homeWinProb)||0, aWin=n(g.awayWinProb)||(100-hWin);
  const hFav = hWin >= 50;
  const h1Fav = (n(g.homeWinProb1H)||0) >= 50;
  const tier = tierOf(g.confidence);
  const r = side => S.rankMap[g[side]] || {};
  const recLine = side => {
    const t = r(side), isHome = side==="home";
    const ctx = isHome ? (t.homeRec || (t.homeW!=null ? t.homeW+"-"+t.homeL : "")) : (t.roadRec || (t.awayW!=null ? t.awayW+"-"+t.awayL : ""));
    const streak = g[side+"Streak"];
    const bits = [t.record, ctx ? `${ctx} ${isHome?"home":"away"}` : "", streak ? `<span class="${g[side+"FormIsFallback"]?"":(streak[0]==="W"?"w":"l")}" title="${g[side+"FormIsFallback"]?"Streak from the model's own game log":"Current streak"}">${esc(streak)}</span>` : ""].filter(Boolean);
    return bits.join(" · ");
  };
  const team = (side, isPick, win, pts) => `
      <div class="tname${isPick?" pick":""}">${teamId(g[side])}<div class="nm"><div class="row1"><strong title="${esc(g[side+"Name"]||g[side])}">${esc(g[side+"Name"]||g[side])}</strong>${b2bSlot(g, side)}</div><div class="rec">${recLine(side)}</div></div></div>
      <div class="wp">${win.toFixed(0)}%</div>
      <div class="pts">${f1(n(pts))}<small>proj</small></div>`;
  const injChips = ["away","home"].filter(s => n(g[s+"InjuryElo"])).map(s => `<span class="lean" title="ELO points the model deducted for ${esc(g[s])} injuries">${esc(g[s])} injuries ${minus("-"+Math.abs(n(g[s+"InjuryElo"])).toFixed(1))} ELO</span>`);
  return `<article class="card" data-gid="${g._gid}">
    <div class="meta"><span class="time">${esc(g.time||"TBD")}</span>
      <span class="right">${g.confidence?`<span class="pill ${tier}">${esc(g.confidence)} confidence</span>`:""}</span></div>
    <div class="teams">
      ${team("away", !hFav, aWin, g.awayScore)}
      ${team("home", hFav, hWin, g.homeScore)}
    </div>
    <div class="bar" role="img" aria-label="Win probability: ${esc(g.away)} ${aWin.toFixed(0)}%, ${esc(g.home)} ${hWin.toFixed(0)}%"><i style="width:${hWin.toFixed(1)}%"></i></div>
    <dl class="lines">
      <div><dt>Model spread</dt><dd>${esc(favLine(g.spread, hFav ? g.home : g.away))}</dd></div>
      <div><dt>Model total</dt><dd>${f1(n(g.fullTotal))}</dd></div>
      <div><dt>1H spread</dt><dd>${esc(favLine(g.spread1H, h1Fav ? g.home : g.away))}</dd></div>
      <div><dt>1H total</dt><dd>${f1(n(g.h1Total))}</dd></div>
    </dl>
    ${injChips.length?`<div class="leans">${injChips.join("")}</div>`:""}
    <details class="more"><summary>Matchup detail</summary>
      <div class="kv">
        <span>Pick</span><b>${esc(g.winner||"—")} (${Math.max(hWin,aWin).toFixed(0)}%)</b>
        <span>ELO (away / home)</span><b>${esc(g.awayElo??"—")} / ${esc(g.homeElo??"—")}</b>
        <span>ATS (away / home)</span><b>${esc(r("away").ats||"—")} / ${esc(r("home").ats||"—")}</b>
        <span>Rest days (away / home)</span><b>${esc(g.awayRestDays??"—")} / ${esc(g.homeRestDays??"—")}</b>
        <span class="full">1st half</span>
        <span>1H pick</span><b>${esc(g.winner1H||"—")}${g.confidence1H?` · ${esc(g.confidence1H)}`:""}</b>
        <span>1H win% (away / home)</span><b>${esc(g.awayWinProb1H??"—")}% / ${esc(g.homeWinProb1H??"—")}%</b>
        <span>1H projected</span><b>${f1(n(g.awayScore1H))} – ${f1(n(g.homeScore1H))}</b>
        <span>1H ELO (away / home)</span><b>${esc(g.awayH1Elo??"—")} / ${esc(g.homeH1Elo??"—")}</b>
      </div>
    </details>
    <details class="more inj"><summary>Injury report<span class="sumx">${injSummary(g)}</span></summary>
      <div class="two">${injuryCol(g,"away")}${injuryCol(g,"home")}</div>
      <div class="subl upd">${S.injUpdated?`Updated ${esc(fmtStamp(S.injUpdated))}`:""}</div>
    </details>
    <details class="more lu"><summary>Projected lineups<span class="sumx">${esc(luSummary(g))}</span></summary>
      <div class="two">${lineupCol(g,"away")}${lineupCol(g,"home")}</div>
      <div class="subl upd">${S.luUpdated?`Updated ${esc(fmtStamp(S.luUpdated))}`:""}</div>
    </details>
  </article>`;
}

// After a live injury/lineup refresh, patch those sections in place (keeps open/closed state).
function patchCards(){
  document.querySelectorAll("article.card[data-gid]").forEach(el => {
    const g = S.games[+el.dataset.gid]; if (!g) return;
    const inj = el.querySelector("details.inj"), lu = el.querySelector("details.lu");
    const fill = (det, sum, cols, upd) => { if (!det) return; det.querySelector(".sumx").innerHTML = sum; det.querySelector(".two").innerHTML = cols; det.querySelector(".upd").textContent = upd ? "Updated " + fmtStamp(upd) : ""; };
    fill(inj, injSummary(g), injuryCol(g,"away") + injuryCol(g,"home"), S.injUpdated);
    fill(lu, esc(luSummary(g)), lineupCol(g,"away") + lineupCol(g,"home"), S.luUpdated);
  });
}

/* ---------- Standings ---------- */
function renderStandings(){
  const key = ui.stGroup==="div" ? "div" : "conf";
  const groups = {};
  S.ranks.forEach(t => { const k = t[key] || "Other"; (groups[k] = groups[k] || []).push(t); });
  const order = key==="div" ? ["Atlantic","Central","Southeast","Northwest","Pacific","Southwest"] : ["East","West"];
  const keys = Object.keys(groups).sort((a,b) => { const ai=order.indexOf(a), bi=order.indexOf(b); return (ai<0?99:ai)-(bi<0?99:bi) || a.localeCompare(b); });
  const pctOf = t => (t.wins||0) / Math.max((t.wins||0)+(t.losses||0), 1);
  const seg = (v,l) => `<button type="button" data-g="${v}" aria-pressed="${ui.stGroup===v}">${l}</button>`;
  $("#view").innerHTML = `
    <h2 class="section-h">Standings</h2>
    <div class="filters"><div class="seg" role="group" aria-label="Group by">${seg("conf","By conference")}${seg("div","By division")}</div>
      ${key==="conf"?`<span class="legend" style="margin:0"><span><i style="background:var(--court)"></i>Playoff line (top 6)</span><span><i style="background:var(--accent)"></i>Play-in line (7–10)</span></span>`:""}</div>
    ${keys.map(k => {
      const teams = groups[k].slice().sort((a,b) => pctOf(b)-pctOf(a) || (b.wins||0)-(a.wins||0));
      const L = teams[0];
      return `<h3 class="group-h">${esc(k)} ${key==="div"?"Division":"Conference"}</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>#</th><th class="l">Team</th><th>W</th><th>L</th><th>Win%</th><th>GB</th><th>Home</th><th>Away</th><th>L10</th><th>Streak</th></tr></thead>
        <tbody>${teams.map((t,i) => {
          const gb = i===0 ? "—" : (((L.wins-t.wins)+(t.losses-L.losses))/2).toFixed(1);
          const cut = key==="conf" ? (i===5 ? "cut" : i===9 ? "cut2" : "") : "";
          return `<tr class="${cut}"><td>${i+1}</td><td class="l team">${logo(t.abbr)}${esc(t.name||t.abbr)}</td><td>${t.wins??"—"}</td><td>${t.losses??"—"}</td><td>${(pctOf(t)*100).toFixed(1)}%</td><td>${gb}</td><td>${esc(t.homeRec||(t.homeW!=null?t.homeW+"-"+t.homeL:"—"))}</td><td>${esc(t.roadRec||(t.awayW!=null?t.awayW+"-"+t.awayL:"—"))}</td><td>${esc(t.form||"—")}</td><td class="${(t.streak||"")[0]==="W"?"pos":(t.streak||"")[0]==="L"?"neg":""}">${esc(t.streak||"—")}</td></tr>`;
        }).join("")}</tbody></table></div>`;
    }).join("")}`;
  document.querySelectorAll(".seg button[data-g]").forEach(b => b.addEventListener("click", () => { ui.stGroup=b.dataset.g; saveUi(); renderStandings(); }));
}

/* ---------- Sortable table helper ---------- */
function sortRows(rows, sort){
  const {k, dir} = sort;
  return rows.slice().sort((a,b) => { const va=a[k], vb=b[k]; if (typeof va==="string" || typeof vb==="string") return dir*String(va??"").localeCompare(String(vb??"")); return dir*((va??-1e9)-(vb??-1e9)); });
}
const thS = (sort, key, label, cls="", title="") => `<th class="${cls}" data-k="${key}" aria-sort="${sort.k===key?(sort.dir>0?"ascending":"descending"):"none"}" scope="col"${title?` title="${title}"`:""}>${label}</th>`;
function bindSort(sort, rerender, ascKeys){
  document.querySelectorAll("th[data-k]").forEach(h => h.addEventListener("click", () => { const kk=h.dataset.k; if (sort.k===kk) sort.dir*=-1; else { sort.k=kk; sort.dir = ascKeys.includes(kk) ? 1 : -1; } rerender(); }));
}

/* ---------- ELO rankings ---------- */
function renderRankings(){
  const rows = S.ranks.map(r => ({...r, h1:n(r.h1Elo)??n(r.elo), wp:r.winPct!=null?n(r.winPct):null, atsD:wlDiff(r.ats), pm:n(r.plusMinus)}));
  if (!rows.length) { $("#view").innerHTML = `<div class="empty">No ratings available.</div>`; return; }
  const byElo = rows.slice().sort((a,b) => b.elo-a.elo);
  const top = byElo[0], bot = byElo[byElo.length-1];
  const avg = rows.reduce((s,r)=>s+r.elo,0)/rows.length;
  const devs = byElo.map(r => r.elo-avg);
  const lo = Math.min(0,...devs), hi = Math.max(0,...devs), span = (hi-lo)||1, zero = (-lo/span)*100;
  const color = c => c==="East" ? "var(--accent)" : "var(--court)";
  const list = sortRows(rows, ui.rkSort);
  const s = ui.rkSort;
  $("#view").innerHTML = `
    <h2 class="section-h">ELO power rankings</h2>
    <div class="strip">
      <div class="stat"><b>${esc(top.abbr)}</b><span>Top ELO · ${esc(top.elo)}</span></div>
      <div class="stat"><b>${Math.round(avg)}</b><span>League average</span></div>
      <div class="stat"><b>${esc(bot.abbr)}</b><span>Lowest · ${esc(bot.elo)}</span></div>
      <div class="stat"><b>${top.elo-bot.elo}</b><span>Top-to-bottom spread</span></div>
    </div>
    <div class="legend"><span><i style="background:var(--accent)"></i>East</span><span><i style="background:var(--court)"></i>West</span><span>Bars: ELO above or below the league average (${Math.round(avg)})</span></div>
    <div class="cbars">${byElo.map((r,i) => { const v=r.elo-avg; const left = v>=0 ? zero : zero - (-v/span)*100; const w = Math.abs(v)/span*100;
      return `<div class="cbar"><span class="lbl" title="${esc(r.name)}">${i+1}. ${esc(r.name||r.abbr)}</span><span class="track"><span class="zero" style="left:${zero}%"></span><span class="fill" style="left:${left}%;width:${Math.max(w,0.5)}%;background:${color(r.conf)}"></span></span><span class="val">${esc(r.elo)}</span></div>`; }).join("")}</div>
    <div class="tablewrap"><table>
      <thead><tr>${thS(s,"elo","ELO")}${thS(s,"name","Team","l")}${thS(s,"conf","Conf","l")}${thS(s,"wp","W-L")}${thS(s,"h1","1H ELO")}${thS(s,"ppg","PPG")}${thS(s,"papg","PAPG")}${thS(s,"atsD","ATS")}</tr></thead>
      <tbody>${list.map(r => `<tr><td><b>${esc(r.elo)}</b></td><td class="l team">${logo(r.abbr)}${esc(r.name||r.abbr)}</td><td class="l"><span class="conf ${esc(r.conf)}">${esc(r.conf||"")}</span></td><td>${esc(r.record||"—")}${r.wp!=null?` <span class="muted">${(r.wp*100).toFixed(1)}%</span>`:""}</td><td>${esc(r.h1??"—")}</td><td>${f1(n(r.ppg))}</td><td>${f1(n(r.papg))}</td><td class="${wlClass(r.ats)}">${esc(r.ats||"—")}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="note">ELO starts every team at the same baseline and moves after each game by how surprising the result was. 1H ELO is the model's first-half rating, used for the first-half picks on each game card.</p>`;
  bindSort(ui.rkSort, renderRankings, ["name","conf"]);
}

/* ---------- Team stats ---------- */
function renderTeams(){
  const rows = S.ranks.map(r => ({...r, wp:r.winPct!=null?n(r.winPct):null, atsD:wlDiff(r.ats), pm:n(r.plusMinus), pace_:n(r.pace), ppg_:n(r.ppg), papg_:n(r.papg), fga_:n(r.fga), tov_:n(r.tov), fta_:n(r.fta), orb_:n(r.orb), formD:wlDiff(r.form)}));
  let list = rows.filter(x => (ui.tsConf==="all" || x.conf===ui.tsConf) && (!ui.tsQ || [x.name,x.abbr].some(v => String(v||"").toLowerCase().includes(ui.tsQ.toLowerCase()))));
  list = sortRows(list, ui.tsSort);
  const s = ui.tsSort;
  const seg = (v,l) => `<button type="button" data-c="${v}" aria-pressed="${ui.tsConf===v}">${l}</button>`;
  $("#view").innerHTML = `
    <h2 class="section-h">Team stats</h2>
    <div class="filters">
      <input id="tq" type="search" placeholder="Find a team" value="${esc(ui.tsQ)}" aria-label="Find a team">
      <div class="seg" role="group" aria-label="Conference">${seg("all","All")}${seg("East","East")}${seg("West","West")}</div>
      <span class="muted">${list.length} of ${rows.length} teams · click a column to sort</span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr>${thS(s,"name","Team","l")}${thS(s,"elo","ELO")}${thS(s,"wp","W-L")}${thS(s,"homeW","Home")}${thS(s,"awayW","Away")}${thS(s,"formD","L10")}${thS(s,"streak","Streak")}${thS(s,"ppg_","PPG","","Points per game")}${thS(s,"papg_","PAPG","","Points allowed per game")}${thS(s,"pm","+/−","","Season point differential per game")}${thS(s,"pace_","Pace","","Estimated possessions per game")}${thS(s,"atsD","ATS","","Season record against the spread")}${thS(s,"fga_","FGA")}${thS(s,"tov_","TOV")}${thS(s,"fta_","FTA")}${thS(s,"orb_","ORB")}</tr></thead>
      <tbody>${list.map(x => `<tr><td class="l team">${logo(x.abbr)}${esc(x.name||x.abbr)} <span class="conf ${esc(x.conf)}">${esc(x.conf||"")}</span></td><td>${esc(x.elo)}</td><td>${esc(x.record||(x.wins!=null?x.wins+"-"+x.losses:"—"))}</td><td>${x.homeW!=null?x.homeW+"-"+x.homeL:esc(x.homeRec||"—")}</td><td>${x.awayW!=null?x.awayW+"-"+x.awayL:esc(x.roadRec||"—")}</td><td${x.formIsFallback?' title="From the model\'s own game log"':""}>${esc(x.form||"—")}${x.formIsFallback?"*":""}</td><td class="${(x.streak||"")[0]==="W"?"pos":(x.streak||"")[0]==="L"?"neg":""}">${esc(x.streak||"—")}</td><td>${f1(x.ppg_)}</td><td>${f1(x.papg_)}</td><td class="${x.pm>0?"pos":x.pm<0?"neg":""}">${signed(x.pm)}</td><td>${f1(x.pace_)}</td><td class="${wlClass(x.ats)}">${esc(x.ats||"—")}</td><td>${f1(x.fga_)}</td><td>${f1(x.tov_)}</td><td>${f1(x.fta_)}</td><td>${f1(x.orb_)}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="note">Pace is estimated from ESPN box-score totals (FGA, ORB, TOV, FTA) with the standard possessions formula. +/− is points scored minus points allowed per game. L10 values marked * come from the model's own game log and can lag the team's true record.</p>`;
  $("#tq").addEventListener("input", e => { ui.tsQ=e.target.value; const p=e.target.selectionStart; renderTeams(); const q=$("#tq"); q.focus(); try{q.setSelectionRange(p,p);}catch(_){} });
  document.querySelectorAll(".seg button[data-c]").forEach(b => b.addEventListener("click", () => { ui.tsConf=b.dataset.c; renderTeams(); }));
  bindSort(ui.tsSort, renderTeams, ["name","conf","streak"]);
}

/* ---------- Data (Apps Script Web App via JSONP) ---------- */
function fetchJSONP(url){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Timed out reaching the model sheet')); }, 15000);
    window[cb] = data => { cleanup(); resolve(typeof data==='string' ? JSON.parse(data) : data); };
    function cleanup(){ clearTimeout(timer); delete window[cb]; sc.parentNode && sc.parentNode.removeChild(sc); }
    sc.onerror = () => { cleanup(); reject(new Error("Couldn't reach the model sheet — its web app didn't return data (usually a script error, a changed web-app address, or access not set to “Anyone”)")); };
    sc.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb + '&_=' + Date.now();   // _ = cache-buster
    document.head.appendChild(sc);
  });
}
const modeUrl = m => WEBAPP_URL + (WEBAPP_URL.includes('?')?'&':'?') + 'mode=' + m;

// If the browser blocks the request under the page's Content Security Policy (typical when a page is shown
// inside a preview/sandbox), it fires this event — record it so the error message can say so.
const cspHits = [];
document.addEventListener('securitypolicyviolation', e => { if (/google/i.test(e.blockedURI || '')) cspHits.push(e.effectiveDirective || e.violatedDirective || 'policy'); });
const whereAmI = () => { let framed = false; try { framed = window.top !== window.self; } catch (_) { framed = true; } return (location.protocol === 'file:' ? 'a local file' : location.protocol + '//' + location.host) + (framed ? ' (inside a frame)' : ''); };

// JSONP first (works from any page); if the script tag is blocked or fails, try fetch() — a different route
// that gets past script-specific blockers (MIME checks, some extensions).
async function loadModel(url){
  try { return await fetchJSONP(url); }
  catch (e1) {
    let why2 = '';
    try {
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000);
      const r = await fetch(url + (url.includes('?')?'&':'?') + '_=' + Date.now(), { redirect: 'follow', signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e2) { why2 = (e2 && e2.name === 'AbortError') ? 'timed out' : (e2.message || String(e2)); }
    const csp = cspHits.length ? ` This page's Content Security Policy blocked the request (${[...new Set(cspHits)].join(', ')}) — the page is running somewhere that doesn't allow loading from script.google.com (for example a preview window); open it from your own web host or as a local file instead.` : '';
    throw new Error(`${e1.message}. The fetch() fallback also failed (${why2}).${csp} Page is running from ${whereAmI()}`);
  }
}

async function refreshInjuries(){
  try {
    const d = await loadModel(modeUrl('injuries'));
    if (d && d.error) throw new Error(d.error);          // keep the injuries already shown
    S.injuries = d.injuries || {};
    S.injUpdated = d.updated || d.generated || null;
    if (S.stamps && d.updated) { S.stamps.injuries = d.updated; if (d.source) S.stamps.injuriesSource = d.source; }
    renderStamps(); patchCards();
  } catch(e) { console.warn('Injury refresh failed:', e); }
}
async function refreshLineups(){
  try {
    const d = await loadModel(modeUrl('lineups'));
    if (d && d.error) throw new Error(d.error);          // keep the lineups already shown
    S.lineups = d.lineups || {};
    S.luUpdated = d.updated || d.generated || null;
    if (S.stamps && d.updated) S.stamps.lineups = d.updated;
    renderStamps(); patchCards();
  } catch(e) { console.warn('Lineup refresh failed:', e); }
}

async function loadAll(){
  try {
    let data;
    try { data = await loadModel(WEBAPP_URL); }
    catch (first) { await new Promise(r => setTimeout(r, 1500)); data = await loadModel(WEBAPP_URL); }   // one quiet retry: Apps Script sometimes fails a cold start
    if (data && data.error) throw new Error('the model sheet reported an error: ' + data.error);
    S.loaded = new Date();
    S.stamps = data.dataUpdated || null;
    S.generated = data.generated || null;
    S.ranks = (data.eloRankings || []).map(r => ({...r, elo:n(r.elo)}));
    S.rankMap = {}; S.ranks.forEach(r => { S.rankMap[r.abbr] = r; });
    S.games = (data.games || []).filter(g => g.label==='Today' || g.label==='Tomorrow').map((g,i) => ({...g, _gid:i, _off: g.label==='Tomorrow' ? 1 : 0}));
    // Back-to-back: teams playing today are on a B2B tomorrow
    S.games.forEach(g => { b2bAddGame(g.away, b2bDay(g._off)); b2bAddGame(g.home, b2bDay(g._off)); });
    S.ready = true; S.err = null;
    $("#notice").innerHTML = "";
    render();
    // Stage 2: live injuries, then lineups, patched into the cards
    refreshInjuries().then(refreshLineups);
  } catch(e) {
    S.err = e;
    $("#notice").innerHTML = `<div class="notice err"><p>Couldn't load the model data: ${esc(e.message||e)}.</p><button class="btn" id="nb">Try again</button> <a href="${esc(modeUrl('status'))}" target="_blank" rel="noopener" style="margin-left:10px">Open the sheet's status page</a><p style="margin:10px 0 0;font-size:.9em;opacity:.85">Tip: open that status page in a <b>private / incognito window</b>. If Google asks you to sign in there, the web app's “Who has access” isn't set to “Anyone” — which is why it can work for you in a signed-in tab but not on this page. If it shows data there, a privacy setting or extension in this browser is blocking the page's request.</p></div>`;
    $("#nb").addEventListener("click", () => { $("#notice").innerHTML=""; loadAll(); });
    render();
  }
}

window.addEventListener("hashchange", render);
render();
loadB2BFromESPN();
loadAll();
})();
